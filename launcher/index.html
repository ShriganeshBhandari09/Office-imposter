<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Office Impostor</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: repeating-linear-gradient(0deg, #11151d 0 32px, #0f131a 32px 64px); color: #e8eaf0;
      font-family: monospace; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: #161b24; border: 4px solid #2c3444; padding: 22px; width: 100%; max-width: 460px; box-shadow: 8px 8px 0 #0a0c10; }
    .logo { display: block; width: 100%; height: auto; margin: 0 0 14px; border-radius: 10px; }
    p { color: #8a93a6; margin: 6px 0 14px; font-size: 15px; line-height: 1.4; }
    input { width: 100%; font: 20px monospace; padding: 10px 12px; background: #0b0e14; color: #e8eaf0; border: 3px solid #2c3444; outline: none; }
    input:focus { border-color: #ffd740; }
    button { width: 100%; margin-top: 12px; font: 20px monospace; color: #e8eaf0; padding: 12px; border: 3px solid #0a0c10;
      background: #3d6b2f; box-shadow: inset -4px -4px 0 #264a1c, inset 4px 4px 0 #5a9147; }
    button:disabled { opacity: 0.5; }
    .link { display: block; margin-top: 16px; color: #8a93a6; font-size: 14px; text-align: center; }
    [hidden] { display: none !important; }
    .err { color: #ff5252; min-height: 1.3em; margin: 10px 0 0; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="wordmark.png" alt="Impostor.exe" />
    <div id="online">
      <p id="status">Connecting to the game server…</p>
      <div class="err" id="oerr"></div>
      <button id="retry" type="button" hidden>Try again</button>
      <a href="#" id="showLocal" class="link">Playing on a local server instead?</a>
    </div>
    <form id="f" hidden>
      <p>Enter the address shown on the host laptop's terminal (for example <b>192.168.1.23:3000</b>). Your phone must be on the same Wi-Fi.</p>
      <input id="addr" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.23:3000" />
      <button id="go" type="submit">Connect</button>
      <div class="err" id="err"></div>
      <a href="#" id="showOnline" class="link">Back to the online server</a>
    </form>
  </div>
  <script>
    // The online game server (Render). The app opens it straight away.
    const ONLINE_URL = 'https://office-impostor.onrender.com';

    const $ = (id) => document.getElementById(id);
    const status = $('status'), oerr = $('oerr'), retry = $('retry');

    // A free server sleeps when unused; the first request wakes it, which can take up to a minute.
    async function reachable(url, ms) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try { await fetch(url + '/healthz', { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal }); return true; }
      catch (e) { return false; }
      finally { clearTimeout(timer); }
    }

    async function connectOnline() {
      retry.hidden = true; oerr.textContent = '';
      status.textContent = 'Connecting to the game server…';
      const slow = setTimeout(() => { status.textContent = 'Waking up the server. This can take up to a minute…'; }, 3000);
      const ok = await reachable(ONLINE_URL, 90000);
      clearTimeout(slow);
      if (ok) { location.replace(ONLINE_URL + '/'); return; }
      status.textContent = '';
      oerr.textContent = "Can't reach the game server. Check your internet connection.";
      retry.hidden = false;
    }
    retry.addEventListener('click', connectOnline);

    // ----- Local (LAN) server -----
    const addr = $('addr'), go = $('go'), err = $('err');
    let stopOnline = false;
    try { addr.value = localStorage.getItem('oi_server') || ''; } catch (e) {}
    $('showLocal').addEventListener('click', (e) => { e.preventDefault(); $('online').hidden = true; $('f').hidden = false; });
    $('showOnline').addEventListener('click', (e) => { e.preventDefault(); $('f').hidden = true; $('online').hidden = false; connectOnline(); });

    // Accepts "192.168.1.23", "192.168.1.23:3000" or a full "http://..." URL.
    function normalise(v) {
      v = v.trim().replace(/\/+$/, '');
      if (!v) return null;
      if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
      try {
        const u = new URL(v);
        if (!u.port && u.protocol === 'http:') u.port = '3000';
        return u.origin;
      } catch (e) { return null; }
    }

    $('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = normalise(addr.value);
      if (!url) { err.textContent = "That address doesn't look right."; return; }
      err.textContent = '';
      go.disabled = true; go.textContent = 'Connecting…';
      if (await reachable(url, 5000)) {
        try { localStorage.setItem('oi_server', addr.value.trim()); } catch (e2) {}
        location.href = url + '/';
        return;
      }
      err.textContent = "Can't reach " + url + ". Check the address, that the server is running, and that you're on the same Wi-Fi.";
      go.disabled = false; go.textContent = 'Connect';
    });

    connectOnline();
  </script>
</body>
</html>
